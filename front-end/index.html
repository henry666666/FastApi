<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理系统 - 前端演示</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fa fa-shopping-cart"></i> 订单管理系统
            </div>
            <div class="nav-links">
                <a href="#" class="nav-link active">首页</a>
                <a href="#" class="nav-link">用户管理</a>
                <a href="#" class="nav-link">商品管理</a>
                <a href="#" class="nav-link">订单管理</a>
                <a href="#" class="nav-link" id="logout-btn">退出登录</a>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="container">
        <!-- 欢迎消息 -->
        <section class="welcome-section">
            <h1>欢迎使用订单管理系统</h1>
            <p>这是一个简单的前端演示页面，用于展示与FastAPI后端的交互功能。</p>
        </section>

        <!-- 登录表单（初始显示） -->
        <section id="login-section" class="form-section">
            <h2><i class="fa fa-sign-in"></i> 用户登录</h2>
            <form id="login-form">
                <div class="form-group">
                <label for="username">用户名：</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
                <div class="form-group">
                    <label for="password">密码：</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
        </section>

        <!-- 用户信息区域（登录后显示） -->
        <section id="user-info-section" class="info-section" style="display: none;">
            <h2><i class="fa fa-user"></i> 用户信息</h2>
            <div id="user-info" class="info-card">
                <!-- 用户信息将通过JavaScript动态填充 -->
                <p>正在加载用户信息...</p>
            </div>
        </section>

        <!-- API交互演示区域 -->
        <section id="api-demo-section" class="demo-section" style="display: none;">
            <h2><i class="fa fa-cogs"></i> API交互演示</h2>
            
            <!-- 商品列表 -->
            <div class="demo-card">
                <h3>商品列表</h3>
                <button id="get-products-btn" class="btn btn-secondary">获取商品列表</button>
                <div id="products-result" class="result-area">
                    <!-- 商品列表将通过JavaScript动态填充 -->
                </div>
            </div>

            <!-- 订单列表 -->
            <div class="demo-card">
                <h3>订单列表</h3>
                <button id="get-orders-btn" class="btn btn-secondary">获取订单列表</button>
                <div id="orders-result" class="result-area">
                    <!-- 订单列表将通过JavaScript动态填充 -->
                </div>
            </div>
        </section>

        <!-- 错误消息区域 -->
        <div id="error-message" class="error-message" style="display: none;">
            <!-- 错误消息将通过JavaScript动态填充 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 订单管理系统 - 前端演示页面</p>
        </div>
    </footer>

    <!-- JavaScript文件 -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
